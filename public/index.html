<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FidgetLab</title>
  <meta name="description" content="FidgetLab — pop-its, spinners, Newton's cradle, gears, joysticks, knobs, sliders and switches with satisfying sounds.">
  <meta name="theme-color" content="#0d0e13">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FidgetLab">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="pager" id="pager" aria-label="Pages"></nav>

  <div class="fabs">
    <button class="fab" id="accountBtn" aria-label="Account">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      <span class="fab-initial" hidden></span>
    </button>
    <button class="fab" id="layoutBtn" aria-label="Switch layout">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-board"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-swipe"><rect x="7" y="4" width="10" height="16" rx="2.5"/><path d="M3.5 9.5L1.5 12l2 2.5M20.5 9.5l2 2.5-2 2.5"/></svg>
    </button>
    <button class="fab" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <button class="done-pill" id="doneEditing" hidden>Done</button>

  <!-- Sheets -->
  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="sheet-head">
      <h2 id="settingsTitle">Settings</h2>
      <button class="icon-btn" data-close aria-label="Close settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body">
      <h3 class="group-label">Layout</h3>
      <div class="segmented" id="layoutSeg" role="radiogroup" aria-label="Layout">
        <button role="radio" data-layout="board">Board</button>
        <button role="radio" data-layout="swipe">Swipe to switch</button>
      </div>
      <p class="hint" id="layoutHint"></p>
      <div class="btn-row" id="boardTools">
        <button class="btn" id="editBoard">Edit board</button>
        <button class="btn" id="resetBoard">Reset board</button>
      </div>

      <h3 class="group-label">Color scheme</h3>
      <div class="schemes" id="schemes" role="radiogroup" aria-label="Color scheme"></div>
      <div class="custom-colors" id="customColors" hidden>
        <label class="color-field"><input type="color" data-color="c1"><span>Primary</span></label>
        <label class="color-field"><input type="color" data-color="c2"><span>Secondary</span></label>
        <label class="color-field"><input type="color" data-color="c3"><span>Accent</span></label>
      </div>

      <h3 class="group-label">Appearance</h3>
      <div class="segmented" id="modeSeg" role="radiogroup" aria-label="Appearance">
        <button role="radio" data-mode="dark">Dark</button>
        <button role="radio" data-mode="light">Light</button>
        <button role="radio" data-mode="system">System</button>
      </div>

      <h3 class="group-label">Sound &amp; feel</h3>
      <div class="row">
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="100" step="1">
      </div>
      <div class="row">
        <span>Sounds</span>
        <button class="mini-switch" id="soundSwitch" role="switch" aria-label="Sounds"></button>
      </div>
      <div class="row" id="hapticsRow">
        <span>Vibration</span>
        <button class="mini-switch" id="hapticsSwitch" role="switch" aria-label="Vibration"></button>
      </div>

      <div id="installBlock" hidden>
        <h3 class="group-label">App</h3>
        <button class="btn primary wide" id="installBtn">Install FidgetLab</button>
        <p class="hint" id="installHint"></p>
      </div>

      <div class="about">
        <span class="logo-tile"><img src="/img/logo.png" alt="" width="297" height="384"></span>
        <span>FidgetLab</span>
      </div>
    </div>
  </section>

  <section class="sheet" id="accountSheet" role="dialog" aria-modal="true" aria-labelledby="accountTitle" hidden>
    <div class="sheet-head">
      <h2 id="accountTitle">Account</h2>
      <button class="icon-btn" data-close aria-label="Close account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="accountBody"></div>
  </section>

  <section class="sheet" id="pickerSheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle" hidden>
    <div class="sheet-head">
      <h2 id="pickerTitle">Choose a fidget</h2>
      <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body"><div class="picker" id="picker"></div></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
